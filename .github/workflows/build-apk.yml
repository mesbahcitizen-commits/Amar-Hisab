name: Build Amar Hisab APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/amar-hisab-2.0']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Android app HTML and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>([\s\S]*?)</script>', html, re.I)
          assert scripts, 'No inline JavaScript found'
          Path('/tmp/amar-hisab-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          ids = set(re.findall(r'\bid=["\']([^"\']+)', html))
          refs = set(re.findall(r"\$\(['\"]([^'\"]+)['\"]\)", '\n'.join(scripts)))
          missing = sorted(refs - ids)
          assert not missing, f'Missing DOM ids: {missing}'
          nav = html.find('class="main-nav"')
          header_end = html.find('</header>')
          main = html.find('<main')
          assert 0 <= header_end < nav < main, 'Shortcut navigation must be below header and above main content'
          for tab in ('report', 'backup', 'settings', 'about'):
              count = len(re.findall(r'data-tab="' + tab + r'"', html))
              assert count == 1, f'Expected exactly one {tab} shortcut, found {count}'
          print('HTML structure and shortcut checks passed')
          PY
          node --check /tmp/amar-hisab-inline.js

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amar-Hisab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
