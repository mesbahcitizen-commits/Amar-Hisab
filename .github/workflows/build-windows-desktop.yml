name: Build Amar Hisab Windows Desktop
on:
  push:
    branches: [feature/amar-hisab-2.0]
    paths:
      - 'desktop/**'
      - 'web/**'
      - '.github/workflows/build-windows-desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy web app into desktop package
        shell: pwsh
        run: Copy-Item -Path web -Destination desktop/web -Recurse -Force
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Amar-Hisab-Windows-Installer
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30