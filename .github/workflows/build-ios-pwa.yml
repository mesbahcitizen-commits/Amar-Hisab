name: Build Amar Hisab iOS PWA ZIP
on:
  push:
    branches: [feature/amar-hisab-2.0]
    paths:
      - 'web/**'
      - '.github/workflows/build-ios-pwa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-ios-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package PWA files
        run: |
          mkdir -p dist/Amar-Hisab-iOS
          cp -R web/. dist/Amar-Hisab-iOS/
          cd dist
          zip -r Amar-Hisab-iOS-PWA.zip Amar-Hisab-iOS
      - name: Upload iOS PWA ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Amar-Hisab-iOS-PWA
          path: dist/Amar-Hisab-iOS-PWA.zip
          if-no-files-found: error
          retention-days: 30
